*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#fbfaf7,#f1ebe2);color:var(--ink)}body{line-height:1.65}.app{display:grid;grid-template-columns:315px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(255,253,248,.94);border-right:1px solid var(--line);padding:22px}.course{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent2);font-weight:900}.title{font-size:1.75rem;line-height:1.05;margin:8px 0;color:#172033}.subtitle{font-size:.94rem;color:var(--muted);margin-bottom:16px}.lang-row{display:flex;gap:8px;margin:14px 0 18px}.btn,.navbtn{font:inherit;font-weight:800;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 13px;cursor:pointer}.btn:hover,.navbtn:hover{box-shadow:0 6px 16px rgba(0,0,0,.08)}.btn.active{background:var(--accent);color:white}.stage-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent2);font-weight:900;margin:18px 0 8px}.navbtn{width:100%;display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:center;text-align:left;border-radius:14px;margin:6px 0;color:#243247}.navbtn .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);font-size:.78rem;color:#4b5563}.navbtn.active{background:var(--accent);color:white;border-color:var(--accent)}.navbtn.active .num{background:rgba(255,255,255,.22);color:white}.main{height:100vh;overflow:auto;padding:0 28px 32px}.topbar{position:sticky;top:0;z-index:10;margin:0 -28px 22px;padding:14px 28px;background:rgba(247,244,238,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}.progress-wrap{flex:1;height:10px;border-radius:999px;background:#e5e0d8;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.25s}.pct{min-width:52px;text-align:right;font-weight:900;color:var(--ac -color:#166534;background:#ecfdf5}.box{white-space:pre-wrap;line-height:1.72;background:#fffdf9;border:1px solid var(--line);border-radius:16px;padding:16px;color:#172033;max-height:390px;overflow:auto}label{display:block;font-weight:900;margin:12px 0 7px;color:#172033}input,textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:14px;background:white;padding:12px;color:#172033}textarea{min-height:130px;resize:vertical}.miniText{min-height:78px}.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.role{background:#fffdf9;border:1px solid var(--line);border-radius:16px;padding:14px}.role strong{display:block;color:#172033}.role small{color:#475569}.actions{display:flex;justify-content:space-between;gap:12px;margin:20px 0}.primary{background:var(--accent);color:white}.good{background:#dcfce7;color:var(--good)}.bad{background:#fee2e2;color:var(--bad)}.promptBox{white-space:normal;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.promptBox p{margin:0 0 13px}.promptBox ul{margin:8px 0 14px 1.2rem;padding:0}.promptBox li{margin:4px 0}.table{width:100%;border-collapse:collapse;margin:15px 0;background:#fff;border-radius:16px;overflow:hidden}.table th,.table td{border:1px solid var(--line);padding:11px;vertical-align:top}.table th{background:var(--soft);text-align:left}.muted{color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:white;border-radius:14px;padding:12px 16px;opacity:0;transform:translateY(8px);transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.main{height:auto;padding:0 14px 24px}.topbar{margin:0 -14px 18px;padding:12px 14px}.grid,.grid3,.roles{grid-template-columns:1fr}.hero h2{font-size:2.2rem}}@media print{.sidebar,.topbar,.actions,.no-print{display:none!important}.app{display:block}.main{height:auto;overflow:visible;padding:0}.panel{display:block!important}.card,.hero{box-shadow:none;break-inside:avoid}}

<script>
const COURSE_DATA = {"texts": [{"id": "text1", "n": 1, "dayEn": "Tuesday", "dayKo": "화요일", "refEn": "1 Thessalonians 4:13–18", "refKo": "데살로니가전서 4:13–18", "exeEn": "How does Paul creatively redeploy standard Jewish apocalyptic imagery — the descent of the Lord, the archangel's call, and the trumpet of God — to specifically address the pastoral crisis of grief and the delayed Parousia among his newly formed, predominantly Gentile converts in Macedonia? How does he combine this with Roman imperial arrival (parousia) rhetoric to comfort a community grieving for believers who have died?", "exeKo": "바울은 주의 강림, 천사장의 소리, 하나님의 나팔이라는 표준적인 유대 묵시 이미지를 어떻게 새롭게 사용하여 마케도니아의 새로 형성된 주로 이방인 공동체가 겪는 슬픔과 지연된 Parousia의 목회적 위기를 다루는가? 또한 그는 로마 제국의 parousia, 곧 왕적 도착 언어를 어떻게 결합하여 이미 죽은 신자들을 두고 슬퍼하는 공동체를 위로하는가?", "herEn": "If Paul's primary objective in unveiling this eschatological timeline is not to provide a rigid chronological map of the end of the world, but to construct a community that \"encourages one another\" in the face of death, how must the contemporary church reshape its own funeral rites and eschatological preaching to prioritize communal hope over individualistic anxiety? In what ways does this text challenge modern, escapist interpretations of the \"rapture\" by emphasizing instead a transformative, bodily participation in the return of the true King?", "herKo": "바울의 목적이 종말의 경직된 시간표를 제공하는 것이 아니라 죽음 앞에서 ‘서로 격려하는’ 공동체를 형성하는 것이라면, 오늘의 교회는 장례 예식과 종말론적 설교를 어떻게 재형성해야 하는가? 이 본문은 ‘휴거’를 도피주의적으로 해석하는 현대적 읽기를 어떻게 도전하며, 참 왕의 귀환에 대한 몸의 변화와 참여를 어떻게 강조하는가?"}, {"id": "text2", "n": 2, "dayEn": "Tuesday", "dayKo": "화요일", "refEn": "2 Thessalonians 2:1–4", "refKo": "데살로니가후서 2:1–4", "exeEn": "How does the author correct the destabilizing rumor that the \"day of the Lord\" has already arrived by introducing specific apocalyptic prerequisites — the rebellion and the lawless one? How does this shifting from an eschatology of sudden imminence to a delayed, sign-dependent timeline alter the pastoral strategy for maintaining community discipline?", "exeKo": "저자는 ‘주의 날’이 이미 왔다는 불안정하게 만드는 소문을 어떻게 교정하는가? 배교와 불법의 사람이라는 특정 묵시적 선행 조건을 제시함으로써, 갑작스러운 임박성의 종말론에서 지연되고 징표를 동반한 시간표로 이동하는 것은 공동체 질서를 유지하기 위한 목회 전략을 어떻게 바꾸는가?", "herEn": "How must the modern church navigate periods of severe societal evil and perceived eschatological delay without succumbing to theological panic or apocalyptic date-setting?", "herKo": "오늘의 교회는 심각한 사회적 악과 종말론적 지연을 경험할 때, 신학적 공황이나 종말 날짜 계산에 빠지지 않고 어떻게 인내와 분별을 유지해야 하는가?"}, {"id": "text3", "n": 3, "dayEn": "Tuesday", "dayKo": "화요일", "refEn": "Galatians 2:15–21", "refKo": "갈라디아서 2:15–21", "exeEn": "In navigating the profound grammatical and theological ambiguity of the Greek phrase pistis Christou, how does understanding it as a subjective genitive (\"the faithfulness of Christ\") rather than an objective genitive (\"faith in Christ\") radically shift the locus of justification from human cognitive assent to the obedient, self-giving action of the Messiah on the cross?", "exeKo": "pistis Christou라는 헬라어 표현의 깊은 문법적·성경적 모호성을 다룰 때, 그것을 목적격 소유격 ‘그리스도에 대한 믿음’이 아니라 주격 소유격 ‘그리스도의 faithfulness’로 이해하면, 의롭다 하심의 중심이 인간의 인지적 동의에서 메시아의 십자가 위 신실하고 자기희생적인 행동으로 어떻게 이동하는가?", "herEn": "By declaring \"I have been crucified with Christ; it is no longer I who live, but Christ who lives in me,\" how does Paul's startling autobiographical confession dismantle modern, highly individualized concepts of religion, demanding instead a complete ontological surrender and participatory union with the crucified Lord?", "herKo": "‘내가 그리스도와 함께 십자가에 못 박혔나니 이제는 내가 사는 것이 아니요 그리스도께서 내 안에 사신다’는 바울의 고백은 현대의 고도로 개인화된 종교 개념을 어떻게 해체하며, 십자가에 달리신 주님과의 참여적 연합과 전인적 자기 내어줌을 어떻게 요구하는가?"}, {"id": "text4", "n": 4, "dayEn": "Tuesday", "dayKo": "화요일", "refEn": "1 Corinthians 1:18–25", "refKo": "고린도전서 1:18–25", "exeEn": "How does Paul deliberately contrast the Greek philosophical pursuit of sophia (wisdom) and the Jewish demand for semeia (signs) with the scandalous, culturally degrading \"foolishness\" of the message of the cross? How does this subvert the honor-shame dynamics of the ancient Mediterranean world?", "exeKo": "바울은 헬라적 sophia 추구와 유대적 semeia 요구를 십자가 메시지의 문화적으로 수치스러운 ‘어리석음’과 어떻게 의도적으로 대비시키는가? 이 대비는 고대 지중해 세계의 명예-수치 역학을 어떻게 전복하는가?", "herEn": "How does Paul's assertion that \"the foolishness of God is wiser than human wisdom\" challenge contemporary Christian attempts to make the gospel culturally respectable, intellectually fashionable, or politically powerful?", "herKo": "‘하나님의 어리석음이 사람보다 지혜롭다’는 바울의 주장은 복음을 문화적으로 존경받게, 지적으로 유행하게, 혹은 정치적으로 강력하게 만들려는 오늘의 기독교적 시도를 어떻게 도전하는가?"}, {"id": "text5", "n": 5, "dayEn": "Tuesday", "dayKo": "화요일", "refEn": "1 Corinthians 11:17–34", "refKo": "고린도전서 11:17–34", "exeEn": "How does the architectural layout of the wealthy Greco-Roman oikos — with its elite dining room (triclinium) and overflow courtyard (atrium) — exacerbate the socioeconomic humiliation of the poor during the Corinthian gathering, prompting Paul to declare that they are not actually eating \"the Lord's Supper\"?", "exeKo": "부유한 그레코-로마 oikos의 건축 구조, 곧 엘리트 식당(triclinium)과 넘쳐나는 이들이 머무는 안뜰(atrium)은 고린도 집회에서 가난한 사람들의 사회경제적 모욕을 어떻게 악화시켰는가? 그래서 바울은 왜 그들이 실제로는 ‘주의 만찬’을 먹는 것이 아니라고 선언하는가?", "herEn": "If failing to \"discern the body\" refers not to a deficit in sacramental theology but to the gross socioeconomic inequity fracturing the local congregation, how does this text force modern believers to evaluate their own eucharistic practices in light of the economic injustices perpetuated against the marginalized in their midst?", "herKo": "‘몸을 분별하지 못함’이 단순한 성례신학의 결핍이 아니라 지역 회중을 찢는 심각한 사회경제적 불평등을 가리킨다면, 이 본문은 오늘의 신자들이 성찬 실천을 자신들 가운데 주변화된 이들에게 지속되는 경제적 불의와 관련하여 어떻게 평가하도록 요구하는가?"}, {"id": "text6", "n": 6, "dayEn": "Friday", "dayKo": "금요일", "refEn": "2 Corinthians 5:16–21", "refKo": "고린도후서 5:16–21", "exeEn": "What is the precise eschatological weight of Paul's declaration that \"if anyone is in Christ, there is a new creation,\" and how does this apocalyptic shifting of the ages necessitate a complete epistemological rupture where believers can no longer regard anyone \"according to the flesh\"? By what mechanism does God reconcile the world to Himself in Christ?", "exeKo": "‘누구든지 그리스도 안에 있으면 새 창조’라는 바울의 선언은 어떤 종말론적 무게를 지니는가? 이 묵시적 시대 전환은 신자들이 더 이상 누구도 ‘육체를 따라’ 알 수 없게 만드는 인식론적 단절을 어떻게 요구하는가? 하나님은 그리스도 안에서 어떤 방식으로 세상을 자신과 화해시키시는가?", "herEn": "If God, who reconciled the world to Himself in Christ, has explicitly entrusted the \"ministry of reconciliation\" to the church as His ambassadors, what are the concrete political and social obligations of a contemporary congregation situated in a deeply polarized society? How does viewing others \"no longer from a human point of view\" fundamentally alter social relationships?", "herKo": "하나님께서 그리스도 안에서 세상을 자신과 화해시키시고 교회에 ‘화해의 직분’을 맡기셨다면, 깊이 양극화된 사회에 위치한 오늘의 회중은 어떤 구체적 정치적·사회적 책임을 지는가? 다른 사람을 ‘더 이상 인간적인 관점에서 보지 않는 것’은 사회 관계를 어떻게 근본적으로 바꾸는가?"}, {"id": "text7", "n": 7, "dayEn": "Friday", "dayKo": "금요일", "refEn": "Romans 3:21–26", "refKo": "로마서 3:21–26", "exeEn": "How does Paul's masterful deployment of the Greek term hilasterion — evoking the blood-sprinkled cover of the Ark of the Covenant on the Day of Atonement — redefine the locus of divine forgiveness by shifting it from the inner sanctuary of the Jerusalem Temple to the public, bloody cross of Jesus Christ? How does he argue that the righteousness of God is demonstrated through the sacrificial, atoning death of Jesus, apart from the Jewish Law?", "exeKo": "바울은 hilasterion이라는 헬라어 용어를 어떻게 정교하게 사용하여 속죄일에 피가 뿌려진 언약궤 덮개를 떠올리게 하는가? 그리고 그 용어를 통해 하나님의 용서의 장소를 예루살렘 성전의 지성소에서 예수 그리스도의 공개적이고 피 흘린 십자가로 어떻게 이동시키는가? 그는 유대 율법과 별개로 예수의 희생적이고 속죄적인 죽음을 통해 하나님의 의가 드러난다고 어떻게 논증하는가?", "herEn": "In stating that \"all have sinned and fall short of the glory of God,\" how does Paul's radical leveling of human morality — stripping both the observant religious insider and the pagan outsider of any claim to superiority — destroy the foundation of modern religious self-righteousness? How does understanding justification as God's \"covenantal faithfulness\" elevate the cross above a mere legal transaction?", "herKo": "‘모든 사람이 죄를 범하여 하나님의 영광에 이르지 못한다’는 말은 종교적 내부자와 이교적 외부자 모두에게서 우월성을 주장할 근거를 어떻게 제거하며, 현대의 종교적 자기의로움을 어떻게 무너뜨리는가? 의롭다 하심을 하나님의 ‘언약적 신실하심’으로 이해할 때, 십자가는 단순한 법적 거래를 넘어 어떻게 높아지는가?"}, {"id": "text8", "n": 8, "dayEn": "Friday", "dayKo": "금요일", "refEn": "Romans 8:1–4, 14–25", "refKo": "로마서 8:1–4, 14–25", "exeEn": "How does Paul's pneumatological logic connect the intimately personal, Spirit-prompted cry of \"Abba, Father!\" to the vast, apocalyptic vision of the entire non-human creation \"groaning in labor pains\" as it awaits its own liberation from the bondage of decay? How does the text describe the transition from the \"law of sin and death\" to the \"law of the Spirit of life,\" and why was the Mosaic Law powerless to achieve this?", "exeKo": "바울의 성령론적 논리는 ‘아바, 아버지!’라는 친밀하고 성령에 의해 일어나는 부르짖음을, 썩어짐의 종노릇에서 해방되기를 기다리며 ‘해산의 고통으로 신음하는’ 비인간 창조 세계 전체의 광대한 묵시적 비전과 어떻게 연결하는가? 본문은 ‘죄와 죽음의 법’에서 ‘생명의 성령의 법’으로의 전환을 어떻게 묘사하며, 모세 율법은 왜 이것을 이룰 수 없었는가?", "herEn": "By asserting that the same Spirit who guarantees our adoption also plunges us into the painful, groaning tension of the \"already and not yet,\" how does this text instruct modern believers to embrace ecological stewardship and profound societal lament as fundamental expressions of Christian hope? How does a community cultivate reliance on the Spirit's liberating power rather than reverting to a paralyzing system of legalistic behavior management?", "herKo": "우리의 양자 됨을 보증하시는 같은 성령께서 우리를 ‘already and not yet’의 고통스럽고 신음하는 긴장 안으로 이끄신다면, 이 본문은 현대 신자들에게 생태적 돌봄과 깊은 사회적 lament를 기독교 소망의 기본 표현으로 어떻게 가르치는가? 공동체는 법주의적 행동 관리로 되돌아가지 않고 성령의 해방하는 능력에 어떻게 의존할 수 있는가?"}, {"id": "text9", "n": 9, "dayEn": "Friday", "dayKo": "금요일", "refEn": "Philippians 2:5–11", "refKo": "빌립보서 2:5–11", "exeEn": "In this majestic Christological hymn, how does the narrative trajectory of the pre-existent Christ — who deliberately abandons the privileges of divine equality (morphe theou) to embrace the degraded status of a slave (morphe doulou) and the ultimate shame of the cross — function as the supreme ethical paradigm for the Philippian community? How does the concept of kenosis (\"self-emptying\") operate theologically?", "exeKo": "이 장엄한 그리스도 찬가에서 선재하신 그리스도는 divine equality의 특권(morphe theou)을 내려놓고 종의 형체(morphe doulou)와 십자가의 궁극적 수치까지 받아들이는 내러티브 궤적을 보인다. 이 궤적은 빌립보 공동체를 위한 최고의 윤리 패러다임으로 어떻게 기능하는가? kenosis, 곧 ‘자기비움’은 성경적으로 어떻게 작동하는가?", "herEn": "If the Lord of the universe defines ultimate power through downward mobility, radical self-emptying, and obedient suffering, how does this hymn completely repudiate modern models of ecclesiastical and corporate leadership that rely on self-promotion, dominance, and the aggressive accumulation of privilege?", "herKo": "우주의 주님이 궁극적 권력을 하향 이동, 급진적 자기비움, 순종적 고난으로 정의하신다면, 이 찬가는 자기 홍보, 지배, 특권 축적에 의존하는 현대의 교회적·기업적 리더십 모델을 어떻게 전면적으로 거부하는가?"}, {"id": "text10", "n": 10, "dayEn": "Friday", "dayKo": "금요일", "refEn": "Philemon 8–16", "refKo": "빌레몬서 8–16", "exeEn": "In navigating the delicate power dynamic with a wealthy house-church leader, why does Paul deliberately refuse to invoke his apostolic authority to issue a command — opting instead to utilize the rhetoric of love and voluntary partnership to intercede for the runaway slave Onesimus? How does Paul employ the language of kinship and eternal providence to persuade Philemon?", "exeKo": "부유한 house-church 지도자와의 섬세한 권력 관계를 다루면서, 바울은 왜 사도 권위를 사용해 명령하지 않고 사랑과 자발적 동역의 수사를 통해 도망한 노예 오네시모를 위해 중재하는가? 바울은 빌레몬을 설득하기 위해 친족 언어와 영원한 섭리의 언어를 어떻게 사용하는가?", "herEn": "When Paul requests that Philemon receive his former property \"no longer as a slave but more than a slave, a beloved brother,\" how does this profound reimagining of human worth challenge contemporary institutions to examine the ways they subtly perpetuate economic exploitation and class subjugation?", "herKo": "바울이 빌레몬에게 이전의 소유물을 ‘더 이상 노예가 아니라 노예 이상으로, 사랑받는 형제’로 받아들이라고 요청할 때, 이 인간 가치의 깊은 재상상은 오늘의 제도들이 경제적 착취와 계급적 종속을 은밀히 지속시키는 방식들을 어떻게 성찰하도록 도전하는가?"}], "scholars": [{"nameEn": "Raymond E. Brown", "descEn": "Historical-critical foundation. Paul's letters as \"immediate literature\" responding to urgent community crises. Careful navigation of Acts vs. Paul's autobiographical accounts. Canonical centrist orientation.", "nameKo": "Raymond E. Brown", "descKo": "역사비평적 기초. 바울의 편지들을 긴급한 공동체 위기에 응답하는 ‘immediate literature’로 읽는다. 사도행전과 바울의 자서전적 진술 사이를 조심스럽게 항해한다. 정경적 중도 지향을 제공한다."}, {"nameEn": "N.T. Wright", "descEn": "Eschatological and covenantal narrative. Justification as covenantal faithfulness to Abraham, not merely individual forensics. Death and resurrection as the definitive turning of the ages. \"New Perspective\" on Paul.", "nameKo": "N.T. Wright", "descKo": "종말론적·언약적 내러티브. 의롭다 하심을 단순한 개인 법정 문제가 아니라 아브라함 언약에 대한 하나님의 신실하심으로 본다. 죽음과 부활을 시대의 결정적 전환으로 읽는다. ‘New Perspective’ on Paul."}, {"nameEn": "David A. deSilva", "descEn": "Socio-rhetorical criticism. Paul's theology as subversion of honor-shame dynamics and patron-client systems. Christ's downward mobility in Philippians as the supreme ethical paradigm. Defends literary unity of 2 Corinthians.", "nameKo": "David A. deSilva", "descKo": "사회수사학 비평. 바울의 성경적 사유가 명예-수치 역학과 후원-의뢰 체계를 어떻게 전복하는지 보여 준다. 빌립보서의 그리스도 하향 이동을 최고의 윤리 패러다임으로 읽는다. 고린도후서의 문학적 통일성을 변호한다."}, {"nameEn": "Luke Timothy Johnson", "descEn": "Anthropological and canonical approach. Letters as living expressions of communal experience. pistis Christou as the \"faith(fulness) of Christ.\" Romans as a fundraising letter. Emphasis on lived faith over abstract doctrine.", "nameKo": "Luke Timothy Johnson", "descKo": "인류학적·정경적 접근. 편지들을 공동체 경험의 살아 있는 표현으로 읽는다. pistis Christou를 ‘그리스도의 faithfulness’로 강조한다. 로마서를 fundraising letter로도 본다. 추상 교리보다 lived faith를 강조한다."}, {"nameEn": "Gordon D. Fee", "descEn": "Pneumatological focus. Church as Spirit-indwelt body of Christ. Charisms governed by self-giving love. Justification must lead to Spirit-empowered transformation. Ecclesiology unintelligible without the Spirit.", "nameKo": "Gordon D. Fee", "descKo": "성령론적 초점. 교회를 성령이 거하시는 그리스도의 몸으로 읽는다. 은사들은 자기희생적 사랑에 의해 다스려져야 한다. 의롭다 하심은 성령에 의해 능력 주어지는 변화로 이어져야 한다. 바울 교회론은 성령 없이 이해될 수 없다."}, {"nameEn": "Bart D. Ehrman", "descEn": "Historical-comparative method. Paul strictly within first-century Jewish apocalypticism. Rigorous boundary between undisputed and pseudepigraphical letters. Sin as cosmic, demonic power; Law powerless to liberate.", "nameKo": "Bart D. Ehrman", "descKo": "역사비교적 방법. 바울을 1세기 유대 묵시주의 안에 엄격히 위치시킨다. 확실한 바울서신과 pseudepigraphical 문헌 사이의 경계를 강조한다. 죄를 우주적이고 악마적인 권세로, 율법을 해방할 수 없는 것으로 본다."}, {"nameEn": "Michael F. Bird", "descEn": "Critical realism and narrative theology. Companion to Wright; emphasizes multi-ethnic \"Messiah-family\" as direct subversive challenge to Roman imperial claims. Jesus, not Caesar, is the true Lord.", "nameKo": "Michael F. Bird", "descKo": "비판적 실재론과 내러티브 성경신학. Wright의 동반자로서 다민족 ‘Messiah-family’를 로마 제국의 주장에 대한 직접적이고 전복적인 도전으로 강조한다. 카이사르가 아니라 예수가 참 주님이다."}, {"nameEn": "D.A. Carson & D.J. Moo", "descEn": "Canonical stability and traditional authentication. Defends authorship and theological unity of the full corpus. Epistolary shifts in style are natural byproducts of different contexts and amanuenses. Cautions against sociological reconstructions overriding forensic justification.", "nameKo": "D.A. Carson & D.J. Moo", "descKo": "정경적 안정성과 전통적 진정성. 전체 corpus의 저작권과 성경적 통일성을 변호한다. 문체 변화는 다양한 맥락과 대필자의 자연스러운 결과라고 본다. 사회학적 재구성이 법정적 의롭다 하심을 압도하지 않도록 경계한다."}], "glossary": [{"termEn": "Immediate Literature", "defEn": "Brown's term for letters written to address urgent pastoral crises rather than detached abstract treatises.", "termKo": "Immediate Literature", "defKo": "Brown이 긴급한 목회적 위기를 다루기 위해 기록된 편지들을 설명할 때 사용하는 표현이다. 추상적 논문이 아니라 즉각적 상황 개입이다."}, {"termEn": "Theology-in-Motion", "defEn": "Paul's theological reasoning as dynamic, missionary, pastoral, and crisis-responsive rather than static system-building.", "termKo": "Theology-in-Motion", "defKo": "정적 체계 구축이 아니라 선교적, 목회적, 위기응답적, 공동체 형성적 움직임 속에서 전개되는 바울의 성경적 사유."}, {"termEn": "Pistis Christou", "defEn": "Greek phrase often debated as faith in Christ or the faithfulness of Christ; the manuscript highlights Johnson's faithfulness reading.", "termKo": "Pistis Christou", "defKo": "‘그리스도에 대한 믿음’ 혹은 ‘그리스도의 faithfulness’로 논의되는 헬라어 표현. 이 앱은 Johnson의 faithfulness 읽기를 강조한다."}, {"termEn": "Dikaiosyne Theou", "defEn": "Righteousness/justice of God; God's active covenantal and justifying intervention.", "termKo": "Dikaiosyne Theou", "defKo": "하나님의 의/정의. 하나님이 언약적으로, 의롭게 하시며, 자비롭게 개입하시는 행동을 가리킨다."}, {"termEn": "Hilasterion", "defEn": "Romans 3 term evoking the mercy seat/atonement locus; used to explain God's justice through Jesus' sacrificial death.", "termKo": "Hilasterion", "defKo": "로마서 3장의 용어로, 속죄소/속죄 장소를 떠올리게 한다. 예수의 희생적 죽음을 통해 하나님의 의가 드러남을 설명한다."}, {"termEn": "Oikos", "defEn": "Household/house-church space where early believers gathered and where social boundaries were contested and transformed.", "termKo": "Oikos", "defKo": "초기 신자들이 모였던 가정/house-church 공간. 사회 경계가 다투어지고 변화되는 장소이다."}, {"termEn": "Parousia", "defEn": "The coming/arrival of the Lord; a major concern in the Thessalonian correspondence.", "termKo": "Parousia", "defKo": "주의 오심/도착. 데살로니가 서신의 중심 관심 중 하나이다."}, {"termEn": "Sophia", "defEn": "Greek wisdom; in 1 Corinthians Paul contrasts human wisdom with the scandalous wisdom of the cross.", "termKo": "Sophia", "defKo": "헬라적 지혜. 고린도전서에서 바울은 인간 지혜를 십자가의 스캔들적 지혜와 대조한다."}, {"termEn": "Koinonia", "defEn": "Participatory fellowship/community; in Paul it entails shared life, mutual care, and socioeconomic reordering.", "termKo": "Koinonia", "defKo": "참여적 교제/공동체. 바울에게 이것은 공유된 삶, 상호 돌봄, 사회경제적 재질서를 포함한다."}, {"termEn": "Already / Not Yet", "defEn": "Paul's eschatological tension: the new age has begun in Christ but awaits final consummation.", "termKo": "Already / Not Yet", "defKo": "바울의 종말론적 긴장. 새 시대는 그리스도 안에서 시작되었지만 아직 최종 완성을 기다린다."}, {"termEn": "Indicative / Imperative", "defEn": "Paul's ethical logic: commands arise from what God has already done in Christ.", "termKo": "Indicative / Imperative", "defKo": "바울 윤리의 논리. 명령은 하나님이 그리스도 안에서 이미 이루신 일에서 나온다."}, {"termEn": "Messiah-Family", "defEn": "Wright/Bird's covenantal description of the multi-ethnic family created through the Messiah.", "termKo": "Messiah-Family", "defKo": "Wright/Bird가 메시아를 통해 창조된 다민족 언약 가족을 설명할 때 사용하는 표현."}, {"termEn": "Honor-Shame", "defEn": "A major Greco-Roman social grammar that Paul's cross-shaped gospel subverts.", "termKo": "Honor-Shame", "defKo": "바울의 십자가 복음이 전복하는 주요 그레코-로마 사회 문법."}, {"termEn": "Patronage", "defEn": "The reciprocal benefaction system Paul often resists to preserve apostolic independence and gospel freedom.", "termKo": "Patronage", "defKo": "상호 후원과 보은 체계. 바울은 복음의 자유를 지키기 위해 이 체계에 얽히는 것을 자주 거부한다."}, {"termEn": "New Creation", "defEn": "The eschatological reality inaugurated in Christ and enacted in reconciled communal life.", "termKo": "New Creation", "defKo": "그리스도 안에서 시작되어 화해된 공동체 삶으로 실행되는 종말론적 현실."}]};

function promptHtml(kind){
  const lines=promptLines(kind); let out=''; let list=false;
  lines.forEach(line=>{ if(line===''){ if(list){out+='</ul>';list=false} return; } if(line.startsWith('- ') || /^[0-9]\. /.test(line)){ if(!list){out+='<ul>';list=true} out += `<li>${esc(line.replace(/^[-0-9. ]+/,''))}</li>`; } else { if(list){out+='</ul>';list=false} out += `<p>${esc(line)}</p>`; }});
  if(list) out+='</ul>'; return out;
}

 const payload={timestamp:new Date().toISOString(),course:'Understanding the Bible',week:'Week 12',topic:'Pauline Epistles',language:state.lang,selectedText:state.text,selectedRefEn:text().refEn,selectedRefKo:text().refKo,route:get('classRoute') || 'UB7',student:{name:get('studentName'),id:get('studentId'),email:get('studentEmail'),classSection:get('classSection')},group:{name:get('groupName'),members:get('members'),reader:get('reader'),scribe:get('scribe'),operator:get('operator'),presenter:get('presenter')},currentStation:{},allStations:{}};
 const stationFields=['firstExe','firstHer','firstInt','aiPaul','aiScholars','aiWWW','aiFull','revisionNotes','groupSimilar','groupDifferent','groupTension','groupAI','finalAnswer','embodiedPractice','galleryCard','peerQuestion'];
 COURSE_DATA.texts.forEach(x=>{payload.allStations[x.id]={refEn:x.refEn,refKo:x.refKo,exeQuestionEn:x.exeEn,exeQuestionKo:x.exeKo,herQuestionEn:x.herEn,herQuestionKo:x.herKo}; stationFields.forEach(f=>{payload.allStations[x.id][f]=localStorage.getItem(LS+':'+x.id+':'+f)||''});});
 payload.currentStation=payload.allStations[state.text];

}

 const json=JSON.stringify(collect(),null,2);
 const savedUrl=localStorage.getItem(LS+':scriptUrl') || '';
 return `<section class="panel active"><div class="hero"><h2>${tr('Submit + Download','제출 + 다운로드')}</h2><p>${tr('Submit to Google Sheets or download JSON as backup.','구글시트로 제출하거나 JSON을 백업으로 다운로드하세요.')}</p></div><div class="card"><h3>${tr('Google Sheets Submission','구글시트 제출')}</h3><label>${tr('Class route','분반 선택')}</label><select id="submitRoute" onchange="setVal('classRoute',this.value)">${['UB7','UB8','UB9','BH'].map(x=>`<option value="${x}" ${(get('classRoute')||'UB7')===x?'selected':''}>${x}</option>`).join('')}</select><label>${tr('Apps Script Web App URL ending in /exec','/exec로 끝나는 Apps Script Web App URL')}</label><input id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(savedUrl)}"><div class="actions"><button class="btn primary" onclick="submitToSheets()">${tr('Submit to Google Sheet','구글시트로 제출')}</button><button class="btn" onclick="window.print()">${tr('Print / Save PDF','인쇄 / PDF 저장')}</button></div></div><div class="card"><h3>${tr('Backup Export','백업 내보내기')}</h3><div class="actions"><button class="btn" onclick="download('UB_Week12_Pauline_ActiveLearning_Submission.json', JSON.stringify(collect(),null,2),'application/json')">${tr('Download JSON','JSON 다운로드')}</button><button class="btn" onclick="navigator.clipboard.writeText(JSON.stringify(collect(),null,2)).then(()=>toast(tr('Copied','복사되었습니다')))">${tr('Copy JSON','JSON 복사')}</button><button class="btn" onclick="if(confirm(tr('Clear all saved work?','저장된 모든 작업을 지울까요?'))){Object.keys(localStorage).filter(k=>k.startsWith(LS)).forEach(k=>localStorage.removeItem(k));location.reload()}">${tr('Reset','초기화')}</button></div><label>${tr('Export Preview','내보내기 미리보기')}</label><textarea style="min-height:420px" readonly>${esc(json)}</textarea></div></section>`;
}
function updateProgress(){
 const completed = fields.filter(f=>get(f).trim().length>2).length;
 const pct=Math.min(100, Math.round(((state.visited.size/navItems.length)*0.35 + (completed/fields.length)*0.65)*100)); style="display:none;"
 document.getElementById('pct').textContent=pct+'%';
 document.getElementById('progress').style.width=pct+'%';
}
function render(){
 renderChrome();
 let html='';
 if(state.active==='welcome') html=renderWelcome();
 if(state.active==='toolkit') html=renderToolkit();
 if(state.active==='station') html=renderStation();
 if(state.active==='first') html=renderFirst();
 if(state.active==='coach') html=renderCoach();
 if(state.active==='revision') html=renderRevision();
 if(state.active==='group') html=renderGroup();
 if(state.active==='tension') html=renderTension();
 if(state.active==='groupai') html=renderGroupAI();
 if(state.active==='final') html=renderFinal();
 if(state.active==='export') html=renderExport();
 const idx=navItems.findIndex(i=>i.id===state.active);
 const prev=navItems[Math.max(0,idx-1)].id;
 const next=navItems[Math.min(navItems.length-1,idx+1)].id;
 html += `<div class="actions no-print"><button class="btn" onclick="go('${prev}')">← ${tr('Previous','이전')}</button><button class="btn primary" onclick="go('${next}')">${tr('Next','다음')} →</button></div>`;
 document.getElementById('screen').innerHTML=html;
 updateProgress();
}
render();
</script>
</body>
